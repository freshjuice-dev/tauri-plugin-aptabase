[package]
name = "tauri-plugin-aptabase"
version = "1.0.0"
license = "MIT"
description = "Tauri Plugin for Aptabase: Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web Apps"
authors = ["Guilherme Oenning"]
edition = "2021"
rust-version = "1.77.2"
readme = "README.md"
repository = "https://github.com/freshjuice-dev/tauri-plugin-aptabase"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-aptabase"

[dependencies]
tauri = "2.11.5"
tokio = "1.52.3"
futures = "0.3.32"
serde = "1.0.228"
serde_json = "1.0.150"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
time = { version = "0.3.53", features = ["formatting"] }
os_info = "3.15.0"
rand = "0.10.2"
log = "0.4.33"
sys-locale = "0.3.2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }